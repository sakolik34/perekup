services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perekup
      POSTGRES_DB: perekup
      # Локальная изолированная сеть; порт БД не публикуется на хосте.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perekup -d perekup"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://perekup@db:5432/perekup}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  postgres_data:
